name: office_viewer_example
description: Example host for office_viewer (PDF + Dart OOXML engines).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  office_viewer:
    path: ../
  office_viewer_engine_convert:
    path: ../packages/office_viewer_engine_convert
  office_viewer_engine_dart:
    path: ../packages/office_viewer_engine_dart
  office_viewer_engine_pdf:
    path: ../packages/office_viewer_engine_pdf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

# Keep monorepo path resolution while engines depend on hosted packages.
dependency_overrides:
  office_viewer:
    path: ../
  office_viewer_engine_dart:
    path: ../packages/office_viewer_engine_dart
  office_viewer_engine_convert:
    path: ../packages/office_viewer_engine_convert


flutter:
  uses-material-design: true
  assets:
    - assets/sample.docx
    - assets/sample_chart.docx
    - assets/large_sheet.xlsx
    - assets/sample_deck.pptx
    - assets/sample.pdf
    - assets/sample.doc
    - assets/sample.xls
    - assets/sample.ppt
