name: office_viewer
description: Tile-based Flutter viewer for local documents. Host-owned chrome, fit-width pan and zoom, soft-fail on corrupt docs. PDF via office_viewer_engine_pdf; DOCX/XLSX/PPTX via in-repo office_viewer_engine_dart.
version: 0.0.8
homepage: https://github.com/juzuli/office_viewer
repository: https://github.com/juzuli/office_viewer
issue_tracker: https://github.com/juzuli/office_viewer/issues

environment:
  # Match office_viewer_engine_pdf (pdfrx ^2.5 needs Flutter >=3.47 / Dart >=3.12).
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

screenshots:
  - description: Word document (DOCX) in the example viewer.
    path: screenshots/word.png
  - description: Excel spreadsheet with charts (XLSX).
    path: screenshots/excel.png
  - description: PowerPoint slide deck (PPTX).
    path: screenshots/powerpoint.png
  - description: PDF with embedded fonts and images.
    path: screenshots/pdf.png
