name: office_viewer_engine_lok
description: LibreOfficeKit rendering engine for office_viewer (Android arm64 Phase 0; iOS stub pending self-build).
version: 0.0.1
publish_to: none
homepage: https://github.com/juzuli/office_viewer
repository: https://github.com/juzuli/office_viewer
issue_tracker: https://github.com/juzuli/office_viewer/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  office_viewer:
    path: ../..
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.officeviewer.office_viewer_engine_lok
        pluginClass: OfficeViewerEngineLokPlugin
      ios:
        pluginClass: OfficeViewerEngineLokPlugin
