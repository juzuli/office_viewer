group = "org.officeviewer.office_viewer_engine_lok"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def resolveLokHome() {
    def env = System.getenv("LOK_HOME")
    if (env != null && !env.isEmpty()) {
        return file(env)
    }
    return file("${project.projectDir}/../third_party/lok")
}

def lokHome = resolveLokHome()
def lokJni = file("${lokHome}/jniLibs")
def lokAssets = file("${lokHome}/assets")

if (!lokJni.exists()) {
    logger.warn(
        "LOK_HOME jniLibs missing at ${lokJni}. " +
        "Run tool/install_lok_home.sh or set LOK_HOME. Android builds that need LOK will fail at link/packaging."
    )
}

android {
    namespace = "org.officeviewer.office_viewer_engine_lok"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        main.java.srcDirs += "src/main/java"
        test.java.srcDirs += "src/test/kotlin"
        if (lokJni.exists()) {
            main.jniLibs.srcDirs += lokJni.absolutePath
        }
        if (lokAssets.exists()) {
            main.assets.srcDirs += lokAssets.absolutePath
        }
    }

    defaultConfig {
        minSdk = 24
        // Fail early when packaging an app that depends on this plugin without LOK.
        buildConfigField "boolean", "HAS_LOK_HOME", lokJni.exists() ? "true" : "false"
    }

    buildFeatures {
        buildConfig = true
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

tasks.register("checkLokHome") {
    doLast {
        if (!lokJni.exists()) {
            throw new GradleException(
                "LOK_HOME not populated (missing ${lokJni}).\n" +
                "  export LOK_HOME=/path/to/lok   # or use packages/office_viewer_engine_lok/third_party/lok\n" +
                "  ./tool/fetch_viewer_apk.sh && ./tool/install_lok_home.sh tool/cache/<apk>"
            )
        }
        def so = file("${lokJni}/arm64-v8a/liblo-native-code.so")
        if (!so.exists()) {
            throw new GradleException("Missing ${so}")
        }
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.contains("JniLib") }.configureEach {
    dependsOn("checkLokHome")
}
tasks.matching { it.name.contains("merge") && it.name.contains("Assets") }.configureEach {
    dependsOn("checkLokHome")
}
