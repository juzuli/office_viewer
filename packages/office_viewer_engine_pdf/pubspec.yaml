name: office_viewer_engine_pdf
description: PDFium-backed PDF engine for office_viewer (pdfrx).
version: 0.0.2
homepage: https://github.com/juzuli/office_viewer
repository: https://github.com/juzuli/office_viewer
issue_tracker: https://github.com/juzuli/office_viewer/issues

environment:
  # pdfrx ^2.5 requires Flutter >=3.47 (Dart >=3.12).
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  office_viewer: ^0.0.1
  # 2.4.7 → pdfrx_engine 0.4.5 fails null-safety analyze on current Dart.
  pdfrx: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
