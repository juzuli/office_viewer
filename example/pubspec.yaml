name: office_viewer_example
description: Example / Phase 0 spike harness for office_viewer (+ LOK engine on Android).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  office_viewer:
    path: ../
  office_viewer_engine_lok:
    path: ../packages/office_viewer_engine_lok
  office_viewer_engine_pdf:
    path: ../packages/office_viewer_engine_pdf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

# Keep monorepo path resolution while engines depend on hosted office_viewer.
dependency_overrides:
  office_viewer:
    path: ../

flutter:
  uses-material-design: true
  assets:
    - assets/sample.docx
    - assets/large_sheet.xlsx
    - assets/sample_deck.pptx
    - assets/sample.pdf
