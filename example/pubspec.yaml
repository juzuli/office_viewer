name: office_viewer_example
description: Minimal PDF example for office_viewer (pub.dev sample).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  office_viewer:
    path: ../
  # Hosted so the example resolves from the pub cache (packages/ is not published).
  office_viewer_engine_pdf: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Monorepo: prefer local engine while developing against main.
dependency_overrides:
  office_viewer:
    path: ../
  office_viewer_engine_pdf:
    path: ../packages/office_viewer_engine_pdf

flutter:
  uses-material-design: true
  assets:
    - assets/sample.pdf
